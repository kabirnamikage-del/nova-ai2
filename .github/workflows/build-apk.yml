name: Build NOVA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "nova-ai.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -q nova-ai.zip -d source

      - name: Build APK
        run: |
          DIR="$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          test -n "$DIR"
          gradle -p "$DIR" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
